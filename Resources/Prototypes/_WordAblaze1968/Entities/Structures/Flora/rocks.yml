- type: entity
  parent: WA68_StructureFloraBase
  id: WA68_StructureFloraRock1
  name: boulder
  description: A boulder you can take cover behind.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Structures/Flora/Rocks/rocks_small.rsi
    state: rock0
    drawdepth: HighFloorObjects
  - type: SpriteFade
  - type: BarricadeBlock
    bidirectional: false
    blocking: 100
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Fixtures
    fixtures:
      cade:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - LowImpassable
        - BulletImpassable

