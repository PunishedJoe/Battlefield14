- type: entity
  parent: BaseItem
  id: WA68_BasicMedicalBase
  suffix: WorldAblaze1968
  abstract: true
  components:
  - type: Healing
    delay: 3

- type: entity
  name: blood bag # also not realistic, realisticaly they would carry plasma or whatever the fuck "serum albumin" is
  description: A plastic bag full of universal O- blood, used for treating hypovolemia.
  parent: WA68_BasicMedicalBase
  id: WA68_BasicMedicalBloodBag1
  components:
  - type: Tag
    tags:
    - WA68_MedicalItemMedium
  - type: Item
    size: Small
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Medical/bloodbag.rsi
    state: blood-4
  - type: Healing
    damageContainers:
    - Biological
    damage:
      types:
        Bloodloss: -5
    ModifyBloodLevel: 90
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: WA68_BasicMedicalBloodBagStack
    count: 1
  - type: ExtendDescription
    descriptionList:
      - description: Has a 3 second use time
        color: "#6ffc03"
        requireDetailRange: true
      - description: Increases blood volume by around ~30%.
        color: "#32a852"
        requireDetailRange: true
      - description: Has a maximum stack size of 5.
        color: "#fc4503"
        requireDetailRange: true

- type: entity
  parent: WA68_BasicMedicalBloodBag1
  id: WA68_BasicMedicalBloodBag5
  components:
  - type: Stack
    stackType: WA68_BasicMedicalBloodBagStack
    count: 5

- type: stack
  id: WA68_BasicMedicalBloodBagStack
  name: blood bag
  icon: { sprite: "_WorldAblaze1968/Objects/Medical/bloodbag.rsi", state: blood-4 }
  spawn: WA68_BasicMedicalDressing1
  maxCount: 5

- type: entity
  parent: WA68_BasicMedicalBase
  id: WA68_BasicMedicalEsmarch
  name: esmarch
  description: A thick strip of rubber thats used to stop arterial bleeds by cutting off blood flow.
  components:
  - type: Tag
    tags:
    - WA68_MedicalItemSmall
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Medical/esmarch.rsi
    state: base
  - type: Clothing
    quickEquip: true
    slots:
    - ARMBANDLEFT
    - ARMBANDRIGHT
  - type: Item
    size: Tiny
  - type: Healing
    damageContainers:
      - Biological
    damage:
      groups:
        Brute: -5
    bloodlossModifier: -20
    delay: 1
    healingEndSound:
      path: /Audio/_WorldAblaze1968/Misc/medical/esmarch.ogg
      params:
        volume: 1.0
        variation: 0.125
  - type: ExtendDescription
    descriptionList:
      - description: Has a 1 second use time
        color: "#6ffc03"
        requireDetailRange: true
      - description: Treats 5 brute.
        color: "#32a852"
        requireDetailRange: true

