- type: entity
  name: ampoule
  parent: BaseItem
  id: WA68_AmpouleBase
  abstract: true
  suffix: WorldAblaze1968
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Medical/ampoule.rsi
    layers:
    - state: base
      map: ["enum.SolutionContainerLayers.fill"]
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 25
  - type: ExaminableSolution
    solution: pen
  - type: Hypospray
    solutionName: pen
    transferAmount: 25
    onlyAffectsMobs: false
    injectOnly: true
    injectSound:
      path: /Audio/_WorldAblaze1968/Misc/medical/ampoule.ogg
      params:
        variation: 0.125
        volume: -2
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: true
    emptySpriteName: broken
  - type: UseDelay
    delay: 0.2
  - type: Appearance
  - type: Tag
    tags:
    - WA68_MedicalItemSmall
    - WA68_MedicalItemTiny
  - type: TrashOnSolutionEmpty
    solution: pen

- type: entity
  name: 6-Pcs ampoule pack
  description: A small pack thats used to ship ampoules.
  parent: WA68_SyretteMedicalCase
  id: WA68_AmpouleMedicalCaseSmellingSalts
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Medical/syrettebox.rsi
    state: green
  - type: StorageFill
    contents:
      - id: WA68_AmpouleSmellingSalts
        amount: 6
  - type: Label
    currentLabel: ammonia inhalants

- type: entity
  description: a glass ampolue. This one containins ammonia inhalants (smelling salts) overuse may cause chemical burns to a persons airways.
  parent: WA68_AmpouleBase
  id: WA68_AmpouleSmellingSalts
  suffix: WorldAblaze1968
  components:
  - type: Label
    currentLabel: ammonia inhalants
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Medical/ampoule.rsi
    layers:
    - state: base
      map: ["enum.SolutionContainerLayers.Fill"]
    - state: blue
      map: ["enum.SolutionContainerLayers.Base"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Water
          Quantity: 20