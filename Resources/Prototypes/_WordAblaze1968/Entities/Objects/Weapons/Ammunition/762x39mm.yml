########################## BULLET

- type: entity
  id: WA68_Bullet762x39mm
  name: bullet
  parent: WA68_BulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 23
    armorPenetration: 0.15

########################## CARTRIDGE

- type: entity
  id: WA68_Cartridge762x39mm
  name: 7.62x39mm cartridge
  description: Lorem ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  parent: WA68_CartridgeBase
  components:
  - type: CartridgeAmmo
    proto: WA68_Bullet762x39mm
    muzzleFlash: MuzzleFlashEffectBFRifle
  - type: Tag
    tags:
    - WA68_CartridgeBase
    - WA68_Cartridge762x39mm
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/pistol.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

########################## MAGS

- type: entity
  parent: WA68_MagazineBaseMedium
  id: WA68_Magazine6L10
  name: 6L10 30-Round magazine 7.62x39mm
  description: Lorem ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  components:
  - type: Tag
    tags:
      - WA68_MagazineAKM
      - WA68_Magazine
  - type: BallisticAmmoProvider
    proto: WA68_Cartridge762x39mm
    mayTransfer: true
    whitelist:
      tags:
        - WA68_Cartridge762x39mm
    capacity: 30
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Magazines/6l10.rsi # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: ExtendDescription
    descriptionList:
      - description: Has an AKM style locking system.
        color: "#4f94ad"
        requireDetailRange: true

