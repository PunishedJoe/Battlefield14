########################## BULLET

- type: entity
  id: WA68_Bullet762x39mm
  name: bullet
  parent: WA68_BulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 23
    armorPenetration: 0.15
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/ballistic.rsi
    layers:
    - state: intermediate

########################## CARTRIDGE

- type: entity
  id: WA68_Cartridge762x39mm
  name: 7.62x39mm cartridge
  description: A intermediate cartridge used by the eastern world.
  parent: WA68_CartridgeBase
  components:
  - type: CartridgeAmmo
    proto: WA68_Bullet762x39mm
    muzzleFlash: MuzzleFlashEffectBFRifle
  - type: Tag
    tags:
    - WA68_CartridgeBase
    - WA68_Cartridge762x39mm
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/intermediate_steel.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

########################## MAGS

- type: entity
  parent: BaseItem
  id: WA68_MagazineClipSKS
  name: SKS 10-Rnd stripper clip
  description: A 10 round SKS stripper clip.
  components:
  - type: Tag
    tags:
      - WA68_Magazine
  - type: Item
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Loaders/762x39clip.rsi
    size: Tiny
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 10
    proto: WA68_Cartridge762x39mm
    whitelist:
      tags:
        - WA68_Cartridge762x39mm
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Loaders/762x39clip.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: WA68_MagazineBaseMedium
  id: WA68_Magazine6L10
  name: 6L10 30-Rnd magazine 7.62x39mm
  description: A 30 round AKM magazine.
  components:
  - type: Tag
    tags:
      - WA68_MagazineAKM
      - WA68_Magazine
  - type: BallisticAmmoProvider
    proto: WA68_Cartridge762x39mm
    mayTransfer: true
    whitelist:
      tags:
        - WA68_Cartridge762x39mm
    capacity: 30
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Magazines/6l10.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: ExtendDescription
    descriptionList:
      - description: Has an AKM style locking system.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  parent: WA68_MagazineBaseMedium
  id: WA68_Magazine6P2
  name: 6P2 40-Rnd magazine 7.62x39mm
  description: A 40 round AKM magazine.
  components:
  - type: Tag
    tags:
      - WA68_MagazineAKM
      - WA68_Magazine
  - type: BallisticAmmoProvider
    proto: WA68_Cartridge762x39mm
    mayTransfer: true
    whitelist:
      tags:
        - WA68_Cartridge762x39mm
    capacity: 40
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Magazines/6p2.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: ExtendDescription
    descriptionList:
      - description: Has an AKM style locking system.
        color: "#4f94ad"
        requireDetailRange: true