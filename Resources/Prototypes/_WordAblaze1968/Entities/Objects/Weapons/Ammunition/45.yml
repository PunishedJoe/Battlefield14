########################## BULLET

- type: entity
  id: WA68_Bullet45
  name: bullet
  parent: WA68_BulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 18
    armorPenetration: 0.05

########################## CARTRIDGE

- type: entity
  id: WA68_Cartridge45
  name: .45 acp cartridge
  description: Lorem ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  parent: WA68_CartridgeBase
  components:
  - type: CartridgeAmmo
    proto: WA68_Bullet45
    muzzleFlash: MuzzleFlashEffectBFPistol
  - type: Tag
    tags:
    - WA68_CartridgeBase
    - WA68_Cartridge45
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/pistol.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

########################## MAGS

- type: entity
  parent: WA68_MagazineBaseSmall
  id: WA68_MagazineM1911
  name: M1911 7-Round magazine .45 acp
  description: Lorem ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  components:
  - type: Tag
    tags:
      - WA68_MagazineM1911
      - WA68_Magazine
  - type: BallisticAmmoProvider
    proto: WA68_Cartridge45
    mayTransfer: true
    whitelist:
      tags:
        - WA68_Cartridge45
    capacity: 7
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Magazines/testmag.rsi # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: ExtendDescription
    descriptionList:
      - description: Has an PM style locking system.
        color: "#4f94ad"
        requireDetailRange: true