      - WA68_MagazineM14
      - WA68_Magazine
  - type: BallisticAmmoProvider
    proto: WA68_Cartridge762x51mm
    mayTransfer: true
    whitelist:
      tags:
        - WA68_Cartridge762x51mm
    capacity: 10
  - type: Sprite
