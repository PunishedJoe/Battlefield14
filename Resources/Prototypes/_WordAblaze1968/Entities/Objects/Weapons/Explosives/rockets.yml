########################## M72 LAW

- type: entity
  id: WA68_RocketM72Law
  categories: [ HideSpawnMenu ]
  suffix: WorldAblaze1968
  parent: BaseCartridgeLauncher
  components:
  - type: CartridgeAmmo
    muzzleFlash: MuzzleFlashEffectBFShotgun
    proto: WA68_RocketProjectileM72LawUnarmed
    deleteOnSpawn: true

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: WA68_RocketProjectileM72LawUnarmed
  name: rocket
  description: This might gib you so avoid it.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/projectiles.rsi # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
    layers:
    - state: pg7v
  - type: Projectile
    damage:
      types:
        Blunt: 20
        Piercing: 30 # these things embed in people so it would defo hurt
    deleteOnCollide: true
  - type: SubmunitionProjectile
    submunitionPrototype: WA68_RocketProjectileM72LawArmed
    distanceDelay: 6
    submunitionDelay: 0
    submunitionCount: 1
    spreadAngle: 0
    velocityMultiplier: 1
  - type: StaminaDamageOnCollide
    damage: 100
  - type: AmbientSound
    range: 50
    enabled: true
    sound:
      path: /Audio/_WorldAblaze1968/Weapons/Rockets/rocketmotor1.ogg

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: WA68_RocketProjectileM72LawArmed
  name: rocket
  description: This might gib you so avoid it.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/projectiles.rsi # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
    layers:
    - state: pg7v
  - type: Projectile
    damage:
      types:
        Structural: 1000 # the Heat comp sucks dawg im gonna simulate the HEAT jopper jet like this instead
  - type: SpawnOnTrigger
    proto: WA68_ExplosionEffect
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: WA68_MediumYieldExplosion
    totalIntensity: 70
    intensitySlope: 3
    maxIntensity: 100
  - type: StaminaDamageOnCollide
    damage: 100
  - type: ProjectileGrenade
    fillPrototype: WA68_SmallFragment
    capacity: 80
  - type: AmbientSound
    range: 50
    enabled: true
    sound:
      path: /Audio/_WorldAblaze1968/Weapons/Rockets/rocketmotor1.ogg

########################## PG7

- type: entity
  id: WA68_RocketPG7V
  suffix: WorldAblaze1968
  name: PG-7V HEAT rocket
  parent: BaseCartridgeLauncher
  description: Lorem Ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  components:
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - WA68_Cartridge
    - WA68_RocketPG7
  - type: CartridgeAmmo
    proto: WA68_RocketProjectilePG7VUnarmed
    deleteOnSpawn: true
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Ammunition/pg7vrocket.rsi
    layers:
    - state: base
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: ExtendDescription
    descriptionList:
      - description: Explodes into 120 fragments.
        color: "#a84832"
        requireDetailRange: true
      - description: Has 6 tile arming distance.
        color: "#b37d2d"
        requireDetailRange: true
      - description: It is ARMED and ready to be loaded, must be DISARMED by activating in hand.
        color: "#24f211"
        requireDetailRange: true
  - type: SpawnItemsOnUse
    items:
      - id: WA68_RocketPG7PBooster
      - id: WA68_RocketPG7PWarhead
    sound:
      path: /Audio/_Goobstation/Items/weapons/Sniper/pickup2.ogg
      params:
        variation: 0.125
  - type: Construction
    graph: WA68_RocketPG7VGraph1
    node: end
  - type: HeldSpeedModifier

- type: entity
  id: WA68_RocketPG7PBooster
  suffix: WorldAblaze1968
  name: PG-7P rocket booster
  parent: BaseItem
  description: Lorem Ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  components:
  - type: Tag
    tags:
    - WA68_RocketPG7PBooster
  - type: Item
    size: Large
    storedRotation: -90
    storedSprite:
      sprite: _WorldAblaze1968/Objects/Weapons/Ammunition/pg7p.rsi
      state: stored
    shape:
    - 0,0,3,0
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Ammunition/pg7p.rsi
    layers:
    - state: base
  - type: ExtendDescription
    descriptionList:
      - description: It is the booster part of a PG-7 rocket, can be combined with compatible PG-7 warheads.
        color: "#b37d2d"
        requireDetailRange: true
  - type: Construction
    graph: WA68_RocketPG7VGraph1
    node: start

- type: entity
  id: WA68_RocketPG7PWarhead
  suffix: WorldAblaze1968
  name: PG-7V HEAT warhead
  parent: BaseItem
  description: Lorem Ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  components:
  - type: Tag
    tags:
    - WA68_RocketPG7VWarhead
  - type: Item
    storedRotation: -90
    storedSprite:
      sprite: _WorldAblaze1968/Objects/Weapons/Ammunition/pg7v.rsi
      state: stored
    size: Large
    shape:
    - 0,0,4,0
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Ammunition/pg7v.rsi
    layers:
    - state: base
  - type: ExtendDescription
    descriptionList:
      - description: Explodes into 40 fragments.
        color: "#a84832"
        requireDetailRange: true
      - description: Has 6 tile arming distance.
        color: "#b37d2d"
        requireDetailRange: true
      - description: It is DISARMED and cannot be loaded, must be ARMED by combining with a PG-7P booster.
        color: "#f21c11"
        requireDetailRange: true
  - type: Construction
    graph: WA68_RocketPG7VGraph2
    node: start

- type: constructionGraph
  id: WA68_RocketPG7VGraph1
  start: start
  graph:
    - node: start
      entity: WA68_RocketPG7PBooster
      edges:
        - to: end
          completed:
            - !type:GivePrototype
              prototype: WA68_RocketPG7V
            - !type:DeleteEntity {}
          steps:
          - tag: WA68_RocketPG7VWarhead
            doAfter: 2
    - node: end
      edges: []

- type: constructionGraph
  id: WA68_RocketPG7VGraph2
  start: start
  graph:
    - node: start
      entity: WA68_RocketPG7VWarhead
      edges:
        - to: end
          completed:
            - !type:GivePrototype
              prototype: WA68_RocketPG7V
            - !type:DeleteEntity {}
          steps:
          - tag: WA68_RocketPG7PBooster
            doAfter: 2
    - node: end
      edges: []

