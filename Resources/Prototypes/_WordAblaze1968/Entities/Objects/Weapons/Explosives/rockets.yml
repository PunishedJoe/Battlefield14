- type: constructionGraph
  id: WA68_RocketPG7VGraph1
  start: start
  graph:
    - node: start
      entity: WA68_RocketPG7PBooster
      edges:
        - to: end
          completed:
            - !type:GivePrototype
              prototype: WA68_RocketPG7V
            - !type:DeleteEntity {}
          steps:
          - tag: WA68_RocketPG7VWarhead
            doAfter: 2
    - node: end
      edges: []

- type: constructionGraph
  id: WA68_RocketPG7VGraph2
  start: start
  graph:
    - node: start
