########################## Usa

- type: entity
  parent: WA68_WeaponGrenadeBase
  id: WA68_WeaponGrenadeUsaM67
  name: M67 frag grenade
  description: Lorem ipsum
  components:
  - type: OnUseTimerTrigger
    delay: 5
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Explosives/m67.rsi
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    fillPrototype: WA68_SmallFragment
    capacity: 115
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: WA68_LowYieldExplosion
    totalIntensity: 110 # center damage 126
    intensitySlope: 3
    maxIntensity: 100
  - type: TimerTriggerVisuals
    primingSound:
      path: "/Audio/_Battlefield14/Weapons/Grenades/trigger2.ogg"
  - type: EmitSoundOnPickup
    sound: /Audio/_Battlefield14/Weapons/Grenades/grab1.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/_Battlefield14/Weapons/Grenades/drop1.ogg
  - type: EmitSoundOnLand
    sound:
      collection: FragGrenadeSFX
  - type: ExtendDescription
    descriptionList:
      - description: Explodes into 115 fragments.
        color: "#a84832"
        requireDetailRange: true

