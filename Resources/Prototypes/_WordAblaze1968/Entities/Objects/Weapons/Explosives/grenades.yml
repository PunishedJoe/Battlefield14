########################## Ussr

- type: entity
  parent: WA68_WeaponGrenadeImpactBase
  id: WA68_WeaponGrenadeImpactUssrRKG3EM
  name: RKG-3EM AT grenade
  description: Lorem ipsum
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,0,2 # real one is quite big since its a anti tank grenade
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Explosives/rkg3em.rsi
    layers:
    - state: icon
    - state: primed
      visible: false
      map: ["enum.ToggleVisuals.Layer"]
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/_Battlefield14/Weapons/Grenades/trigger2.ogg
    soundDeactivate:
      path: /Audio/_Battlefield14/Weapons/Grenades/disable1.ogg
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: WA68_MediumYieldExplosion
    totalIntensity: 70 # center damage 225
    intensitySlope: 5
    maxIntensity: 100
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    fillPrototype: WA68_SmallFragment
    capacity: 25
  - type: EmitSoundOnPickup
    sound: /Audio/_Battlefield14/Weapons/Grenades/grab1.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/_Battlefield14/Weapons/Grenades/drop1.ogg
  - type: EmitSoundOnLand
    sound:
      collection: FragGrenadeSFX
  - type: ExtendDescription
    descriptionList:
      - description: Explodes into 25 fragments.
        color: "#a84832"
        requireDetailRange: true
      - description: Has a impact fuse. Activate to hand to arm, activate again to disarm.
        color: "#b37d2d"
        requireDetailRange: true

