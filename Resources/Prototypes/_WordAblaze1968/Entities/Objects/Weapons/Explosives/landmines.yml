- type: entity
  parent: BaseItem
  id: WA68_WeaponExplosiveLandmineNatoUsaM16Disarmed
  name: M16
  description: A M16 anti-personel landmine.
  suffix: WorldAblaze1968
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _WorldAblaze1968/Objects/Weapons/Explosives/m16.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SpawnAfterInteract
    prototype: WA68_WeaponExplosiveLandmineNatoUsaM16Armed
    doAfter: 3
    removeOnInteract: true
  - type: ExtendDescription
    descriptionList:
      - description: It is disarmed, left click on a tile to place and arm it.
        color: green
        requireDetailRange: true

- type: entity
  name: M16
  description: A M16 anti-personel landmine.
  parent: WA68_WeaponExplosiveLandmineBase
  id: WA68_WeaponExplosiveLandmineNatoUsaM16Armed
  suffix: WorldAblaze1968
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _WorldAblaze1968/Objects/Weapons/Explosives/m16.rsi
    state: armed
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: WA68_LowYieldExplosion
    totalIntensity: 110 # Kills with shrapnell not blast
    intensitySlope: 3
    maxIntensity: 100
  - type: SpawnOnTrigger
    proto: WA68_ExplosionEffect
  - type: ProjectileGrenade
    fillPrototype: WA68_SmallFragment
    capacity: 20
    randomAngle: false
  - type: TriggerOnSignal
  - type: ExtendDescription
    descriptionList:
      - description: It is ARMED. Use a multitool to disarm.
        color: red
        requireDetailRange: true
  - type: Construction
    graph: WA68_WeaponExplosiveLandmineNatoUsaM16Graph
    node: start
    deconstructionTarget: start
  - type: LandMine
    sound:
        path: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
  - type: StepTrigger
    requiredTriggeredSpeed: 2.6
    stepOn: true

- type: constructionGraph
  id: WA68_WeaponExplosiveLandmineNatoUsaM16Graph
  start: start
  graph:
    - node: start
      edges:
        - to: WA68_WeaponExplosiveLandmineNatoUsaM16Graph
          completed:
            - !type:AdminLog
            - !type:SpawnPrototype
              prototype: WA68_WeaponExplosiveLandmineNatoUsaM16Disarmed
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Pulsing
              doAfter: 2

