    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier

- type: constructionGraph
  id: WA68_MortarMediumUsaM29Graph
  start: folded
  graph:
    - node: folded
      entity: WA68_MortarMediumUsaM29Folded
      edges:
        - to: unfolded
          completed: # kids this is something we call in the industry "shitcode"
            - !type:GivePrototype
              prototype: WA68_MortarTools
          steps:
          - tag: WA68_MortarToolsTag
            doAfter: 2
