########################## Usa

- type: entity
  id: WA68_MortarLightUsaM2Unfolded
  parent: BaseStructureDynamic
  name: M-2 mortar
  suffix: WorldAblaze1968
  description: Lorem ipsum
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Largearms/Mortars/m2.rsi
    layers:
      - state: base
    noRot: true
  - type: Mortar
    baseAccuracy: 0.5
    accuracyDegradation: 0.05
    minOffsetX: -70
    maxOffsetX: 70
    minOffsetY: -70
    maxOffsetY: 70
    minSafeDistance: 5
  - type: ContainerContainer
    containers:
      mortar_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      mortar_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - WA68_MortarShellM260mm
  - type: ExtendDescription
    descriptionList:
      - description: Has a range of 5 - 70 Tiles
        color: "#b37d2d"
        requireDetailRange: true
      - description: Uses 60mm mortar shells.
        color: "#4f94ad"
        requireDetailRange: true
      - description: It a LIGHT mortar and doesnt need to be folded to be picked up.
        color: "#24f211"
        requireDetailRange: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 600
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: InteractionOutline
  - type: Item
    size: Huge
    sprite: _WorldAblaze1968/Objects/Weapons/Largearms/Mortars/m2.rsi
  - type: MultiHandedItem
  - type: ClothingSpeedModifier # this thing weighs around 20 Kg thats around 83.3 Big Macs for you americans
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier

