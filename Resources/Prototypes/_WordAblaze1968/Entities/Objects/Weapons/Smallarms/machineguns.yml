########################## West Germany

- type: entity
  name: MG3
  parent: WA68_WeaponMachinegunBase
  id: WA68_WeaponUsaMG3
  description: Lorem ipsum
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Machineguns/mg3.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Machineguns/mg3.rsi
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Machineguns/mg3.rsi
  - type: Gun
    fireRate: 20 # 1200 RPM
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/m60_close.ogg
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: WA68_MagazineMG3
        priority: 2
        whitelist:
          tags:
            - WA68_MagazineMG3
        whitelistFailPopup: gun-magazine-whitelist-fail
        swap: false
      gun_chamber:
        name: Chamber
        startingItem: WA68_Cartridge762x51mm
        priority: 1
        whitelist:
          tags:
            - WA68_Cartridge762x51mm
  - type: ExtendDescription
    descriptionList:
      - description: Accepts MG3 style magazines.
        color: "#4f94ad"
        requireDetailRange: true

