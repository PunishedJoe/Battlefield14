  - type: ExtendDescription
    descriptionList:
      - description: Explodes into 70 fragments.
        color: "#a84832"
        requireDetailRange: true
      - description: Uses rockets with a 6 tile arming distance.
        color: "#b37d2d"
        requireDetailRange: true
      - description: It is UNFOLDED and ready to fire. It can no be folded or stored in aux or suit slot.
        color: "#24f211"
        requireDetailRange: false

########################## Ussr

- type: entity
  name: RPG-7
  parent: WA68_WeaponLauncherBase
  id: WA68_WeaponUssrRPG7
  description: The iconic ''RPG'', its the rocket launcher you think of when somebody says rocket launcher.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/rpg7.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/rpg7.rsi
    slots:
    - Back
    - suitStorage
  - type: Gun
    projectileSpeed: 55 # 55 because its rocket powered
    fireRate: 0.5
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/rpg7_close.ogg
      params:
        variation: 0.1
  - type: BallisticAmmoProvider
    autoCycle: true
    whitelist:
      tags:
        - WA68_RocketPG7
    proto: WA68_RocketPG7V
    capacity: 1
    soundInsert:
      path: /Audio/_WorldAblaze1968/Weapons/Interactions/Heavy/rocket_load1.ogg
      params:
        variation: 0.1
    soundRack:
      path: /Audio/_WorldAblaze1968/Weapons/Interactions/Heavy/rocket_unload1.ogg
      params:
        variation: 0.1
  - type: GunRequiresWield
  - type: Wieldable
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: ExtendDescription
    descriptionList:
      - description: Uses rockets with a 6 tile arming distance.
        color: "#b37d2d"
        requireDetailRange: true