########################## West Germany

- type: entity
  name: Carl Gustaf m/64
  parent: WA68_WeaponBreakActionBase
  id: WA68_WeaponWestGerCarlGustafM64
  description: A sweedish recoilless rifle.
  components:
  - type: Item
    size: Huge
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/carlgustaf64.rsi
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/carlgustaf64.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/carlgustaf64.rsi
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        startingItem: WA68_Shell84mmRFFV551
        priority: 1
        whitelist:
          tags:
            - WA68_Shell84mmR
  - type: Gun
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/m67_close.ogg
      params:
        volume: 2
        variation: 0.1
  - type: ExtendDescription
    descriptionList:
      - description: Uses shells with a 6 tile arming distance.
        color: "#b37d2d"
        requireDetailRange: true

########################## Usa

- type: entity
  name: M79
  parent: WA68_WeaponBreakActionBase
  id: WA68_WeaponUsaM79
  description: A single shot break action grenade launcher, nicknamed as the ''Thumper''
  components:
  - type: Item
    size: Huge
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/m79.rsi
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/m79.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/m79.rsi
    slots:
    - Back
    - suitStorage
    - SUITSTORAGE2
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      suitstorage2:
      - state: equipped-BACKPACK
      suitstorage:
      - state: equipped-SUITSTORAGE
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        insertSound: /Audio/_WorldAblaze1968/Weapons/Interactions/GrenadeLauncher/load1.ogg
        startingItem: WA68_Shell40x46mmRM406
        priority: 1
        whitelist:
          tags:
            - WA68_Shell40x46mmR
  - type: Gun
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/m79_close.ogg
      params:
        volume: 2
        variation: 0.1
  - type: ExtendDescription
    descriptionList:
      - description: Uses shells with a 4 tile arming distance.
        color: "#b37d2d"
        requireDetailRange: true

