- type: entity
  name: M72A2 LAW
  parent: WA68_WeaponLauncherUnFoldedBase
  id: WA68_WeaponUsaM72A2UnFolded
  description: A single shot disposable rocket launcher.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Launchers/m72law/unfolded.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
