- type: entity
  name: SVD
  parent: WA68_WeaponSniperBase
  id: WA68_WeaponUssrSVD
  description: A designated marksman rifle made to replace the outdated mosin nagant.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/svd.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/svd.rsi
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/svd.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/svd_close.ogg
      params:
        volume: -2
        variation: 0.1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_WorldAblaze1968/Weapons/Interactions/Sniper/load1.ogg
        ejectSound: /Audio/_WorldAblaze1968/Weapons/Interactions/Sniper/unload1.ogg
        startingItem: WA68_Magazine6L2
        priority: 2
        whitelist:
          tags:
            - WA68_Magazine6L2
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: WA68_Cartridge762x54mmR
        priority: 1
        whitelist:
          tags:
            - WA68_Cartridge762x54mmR
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
  - type: ExtendDescription
    descriptionList:
      - description: Accepts SVD style magazines.
        color: "#4f94ad"
        requireDetailRange: true
      - description: Gives tier 2 zoom when wielded.
        color: "#42ad54"
        requireDetailRange: true

- type: entity
  parent: WA68_WeaponUssrSVD
