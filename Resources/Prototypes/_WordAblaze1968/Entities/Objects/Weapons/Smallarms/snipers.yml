########################## West Germany

- type: entity
  name: G3A3ZF
  parent: WA68_WeaponWestGerG3A3
  id: WA68_WeaponWestGerG3A3ZF
  description: A accurized G3A3 with a side mounted sight.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/g3a3zf.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/g3a3zf.rsi
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/g3a3zf.rsi
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 6
    pvsIncrease: 0.7
  - type: ExtendDescription
    descriptionList:
      - description: Accepts G3 style magazines.
        color: "#4f94ad"
        requireDetailRange: true
      - description: Gives a tier 1 zoom when wielded.
        color: "#42ad54"
        requireDetailRange: true

