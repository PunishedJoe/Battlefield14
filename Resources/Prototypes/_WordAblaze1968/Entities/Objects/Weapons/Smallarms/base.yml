- type: entity ########################## PISTOLS
  parent: BaseItem
  id: WA68_WeaponPistolBase # for pistols duh
  suffix: WorldAblaze1968
  abstract: true
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/testgun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/testmag.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
    - SUITSTORAGE2
  - type: Gun
    minAngle: 1
    maxAngle: 22
    angleIncrease: 6
    angleDecay: 90
    fireRate: 7 # 420 RPM
    damageModifier: 0.9 # slightly worse DMG because shorter barrel or something
    projectileSpeed: 40
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_WorldAblaze1968/Weapons/Interactions/Pistol/rack1.ogg
      params:
        variation: 0.1
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: WA68_MagazineBaseSmall
        insertSound:
          path: /Audio/_WorldAblaze1968/Weapons/Interactions/Pistol/magin1.ogg
          params:
            variation: 0.1
        ejectSound:
          path: /Audio/_WorldAblaze1968/Weapons/Interactions/Pistol/magout1.ogg
          params:
            variation: 0.1
        priority: 2
        whitelist:
          tags:
            - WA68_MagazineBase
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: WA68_CartridgeBase
        priority: 1
        whitelist:
          tags:
            - WA68_Cartridge
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: EmitSoundOnPickup
    sound:
      collection: PistolsPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: PistolsDrop
  - type: EmitSoundOnLand
    sound:
      collection: PistolsDrop
  - type: Appearance
  - type: Tag
    tags:
      - WA68_Handgun

