########################## West Germany

- type: entity
  name: G3A3
  parent: WA68_WeaponRifleBase
  id: WA68_WeaponWestGerG3A3
  description: Lorem ipsum # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/g3a3.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/g3a3.rsi
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Rifles/g3a3.rsi
  - type: Gun # Full power round so higher angle increase per shot
    angleIncrease: 9
    angleDecay: 90
    fireRate: 10 # 600 RPM
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/g3_close.ogg
      params:
        volume: -2.5
        variation: 0.1
  - type: ChamberMagazineAmmoProvider
    soundBoltClosed:
      path: /Audio/_WorldAblaze1968/Weapons/Interactions/Rifle/close3.ogg
      params:
        volume: -1.5
        variation: 0.1
    soundBoltOpened:
      path: /Audio/_WorldAblaze1968/Weapons/Interactions/Rifle/open3.ogg
      params:
        volume: -1.5
        variation: 0.1
    soundRack:
      path: /Audio/_WorldAblaze1968/Weapons/Interactions/Rifle/rack3.ogg
      params:
        volume: -1.5
        variation: 0.1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: WA68_MagazineG3
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg # TODO TODO TODO TODO TODO TODO TODO TODO TODO TODO
        priority: 2
        whitelist:
          tags:
            - WA68_MagazineG3
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: WA68_Cartridge762x51mm
        priority: 1
        whitelist:
          tags:
            - WA68_Cartridge762x51mm
  - type: ExtendDescription
    descriptionList:
      - description: Accepts G3 style magazines.
        color: "#4f94ad"
        requireDetailRange: true

