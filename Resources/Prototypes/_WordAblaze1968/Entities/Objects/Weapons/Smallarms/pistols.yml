########################## Usa

- type: entity
  name: M1911
  parent: WA68_WeaponPistolBase
  id: WA68_WeaponUsaM1911
  description: The iconic ''M1911'' pistol, chambered in the god's caliber.
  components:
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Pistols/m1911.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Pistols/m1911.rsi
  - type: Clothing
    sprite: _WorldAblaze1968/Objects/Weapons/Smallarms/Pistols/m1911.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_WorldAblaze1968/Weapons/Gunshots/m1911_close.ogg
      params:
        volume: -1.5
        variation: 0.1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: WA68_MagazineM1911
        priority: 2
        whitelist:
          tags:
            - WA68_MagazineM1911
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: WA68_Cartridge45
        priority: 1
        whitelist:
          tags:
            - WA68_Cartridge45
  - type: ExtendDescription
    descriptionList:
      - description: Accepts M1911 style magazines.
        color: "#4f94ad"
        requireDetailRange: true

