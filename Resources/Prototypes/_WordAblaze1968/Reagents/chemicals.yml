- type: reagent
  id: WA68_ChemicalNarcoticMorphine
  name: Morphine
  group: Narcotics
  desc: A opioid painkiller, its overdose can cause respiratory arrest and organ failure.
  physicalDesc: reagent-physical-desc-neural # morphine looks like water
  flavor: extremly bitter and sharp # morphine has a "extremly bitter,sharp and chemical taste".
  color: "#dfe6e5"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        conditions:
        - !type:TotalDamage
          min: 5
        - !type:ReagentThreshold
          max: 5.5
        damage:
          groups:
            Burn: -1.5
            Brute: -3
    Narcotic:
      metabolismRate: 0.5
      effects:
      - !type:MovespeedModifier # Morphine is a depressant
        walkSpeedModifier: 0.80
        sprintSpeedModifier: 0.80
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          min: 4
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 20
        refresh: true
      - !type:Emote
        emote: Laugh
        showInChat: true
        probability: 0.2
        conditions:
        - !type:ReagentThreshold
          max: 20
      - !type:Drunk
        conditions:
        - !type:ReagentThreshold
          min: 7
        slurSpeech: true
        boozePower: 7
      - !type:HealthChange # morphine is bad for you
        conditions:
        - !type:ReagentThreshold
          min: 5.01
        damage:
          types:
            Poison: 0.5
            Asphyxiation: 1 # Minor respiratory depression
      - !type:HealthChange # overdose
        conditions:
        - !type:ReagentThreshold
          min: 10.01
        damage:
          types:
            Poison: 1.5 # Organ damage
            Asphyxiation: 6 # Major respiratory depression
            Cellular: 0.5
      - !type:ChemVomit
        probability: 0.05
        conditions:
        - !type:ReagentThreshold
          min: 10.01
      - !type:Drunk
        boozePower: 15
        conditions:
        - !type:ReagentThreshold
          min: 10.01
      - !type:HealthChange # extreme overdose
        conditions:
        - !type:ReagentThreshold
          min: 15
        damage:
          types:
            Poison: 6 # Organ failure
            Asphyxiation: 18 # Respiratory arrest
            Cellular: 3
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          min: 15
        key: ForcedSleep
        time: 5
        type: Add
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          min: 2
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous" ]
        probability: 0.5