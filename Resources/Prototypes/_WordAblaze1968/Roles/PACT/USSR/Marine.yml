- type: job
  id: WA68_RolePactUssrMarineReserve
  name: USSR Marine reservist
  description: When your predecessors fail you get sent into the meatgrinder.
  playTimeTracker: WA68_RolePactUssrMarineReserveTime
  weight: 1
  startingGear: WA68_RolePactUssrMarineReserveGear
  alwaysUseSpawner: true
  icon: "WA68_JobIconPactReserve"
  requireAdminNotify: false
  supervisors: Squad leader
  canBeAntag: false
  special:
  - !type:AddLanguageSpecial
    languagesSpoken:
    - Russian
    languagesUnderstood:
    - Russian
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - WA68_Pact
      - WA68_Ussr
    - type: ChatRank
      rank: Ryt.

