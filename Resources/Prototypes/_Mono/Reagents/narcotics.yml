- type: reagent
  id: Fentanyl
  name: reagent-name-fent
  group: Narcotics
  desc: reagent-desc-fent
  physicalDesc: reagent-physical-desc-crystalline
  flavor: bitter
  color: "#b4dae0"
  metabolisms:
    Medicine:
      metabolismRate: 0.5 # BF14 1 > 0.5
      effects:
      - !type:HealthChange
        conditions:
        - !type:TotalDamage
          min: 5
        - !type:ReagentThreshold
          max: 5.5
        damage:
          groups:
            Burn: -1.5 # -3
            Brute: -3 # -6 # its a painkiller
#BF14            Toxin: -1
            Airloss: -1.5
    Narcotic:
      metabolismRate: 0.5 # BF14 1 > 0.5
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 0.40
        sprintSpeedModifier: 0.40
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter
      - !type:GenericStatusEffect
        key: ForcedSleep
        time: 5
        type: Add
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          min: 5.5 # BF14
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 20
        refresh: true
      - !type:Emote
        emote: Laugh
        showInChat: true
        probability: 0.2
        conditions:
        - !type:ReagentThreshold
          max: 20
      - !type:Drunk
        conditions:
        - !type:ReagentThreshold
          min: 5.5 # BF14
        slurSpeech: true
        boozePower: 5 # BF14 75
        # OD effects
      - !type:ChemVomit
        probability: 0.05
        conditions:
        - !type:ReagentThreshold
          min: 5.5 # BF14
      - !type:Drunk
        boozePower: 15
        conditions:
        - !type:ReagentThreshold
          min: 5.5 # BF14
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 6.5
        damage:
          types:
            Poison: 1.75
            Asphyxiation: 3
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 12.5
        damage:
          types:
            Poison: 4
            Asphyxiation: 4.25 # from wikipedia - "The most dangerous adverse effect of fentanyl is respiratory depression"
            Cellular: 1.5 # for fun
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          min: 2
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous" ]
        probability: 0.5
      - !type:CauseZombieInfection # BF14
        conditions:
          - !type:ReagentThreshold
            min: 30.5

# Monolithic

- type: reagent
  id: Gestalzitine
  name: reagent-name-gestalzitine
  group: Toxins
  desc: reagent-desc-gestalzitine
  physicalDesc: reagent-physical-desc-translucent
  color: "#6eebdd"
  boilingPoint: 444.0
  meltingPoint: 128.0
  metabolisms:
    Poison:
      effects:
      - !type:Emote
        emote: Yawn
        showInChat: true
        probability: 0.1
      - !type:MovespeedModifier
        conditions:
        - !type:OrganType # Goobstation - Yowie
          type: Yowie
          shouldHave: false
        walkSpeedModifier: 0.35
        sprintSpeedModifier: 0.45
      - !type:GenericStatusEffect
        conditions:
        - !type:OrganType # Goobstation - Yowie
          type: Yowie
          shouldHave: false
        key: Drowsiness
        component: Drowsiness
        time: 1
        type: Add
        refresh: false
      - !type:GenericStatusEffect
        conditions:
        - !type:OrganType # Goobstation - Yowie
          type: Yowie
          shouldHave: false
        - !type:ReagentThreshold
          reagent: Gestalzitine
          min: 30 # Mono
        key: ForcedSleep
        component: ForcedSleeping
        refresh: false
        type: Add
