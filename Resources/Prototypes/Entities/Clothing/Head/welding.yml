- type: entity
  parent: ClothingHeadBase
  id: WeldingMaskBase
  name: welding mask
  abstract: true
  components:
  - type: Item
    storedRotation: 0
  - type: IngestionBlocker
  - type: FlashImmunity
  - type: IdentityBlocker
  - type: EyeProtection
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
      Glass: 100
  - type: StaticPrice
    price: 50
  - type: Tag
    tags:
    - WhitelistChameleon
    - WeldingMask
  - type: HideLayerClothing
    slots:
    - Snout

- type: entity
  parent: WeldingMaskBase
  id: ClothingHeadHatWelding
  name: welding mask
  description: A head-mounted face cover designed to protect the wearer completely from space-arc eye.
  components:
  - type: Sprite
    sprite: Clothing/Head/Welding/welding.rsi
  - type: Clothing
    sprite: Clothing/Head/Welding/welding.rsi
  - type: Tag
    tags:
    - HamsterWearable
    - WhitelistChameleon
    - WeldingMask

- type: entity
  parent: WeldingMaskBase
  id: ClothingHeadHatWeldingMaskFlame
  name: flame welding mask
  description: A painted welding helmet, this one has flames on it.
  components:
  - type: Sprite
    sprite: Clothing/Head/Welding/flame_welding_mask.rsi
  - type: Clothing
    sprite: Clothing/Head/Welding/flame_welding_mask.rsi

- type: entity
  parent: WeldingMaskBase
  id: ClothingHeadHatWeldingMaskFlameReinforced
  name: reinforced flame welding mask
  description: A painted welding helmet, this one has flames on it. It has armor steel welded on the exterior, making it into a ballistic mask and helmet essentially.
  components:
  - type: Sprite
    sprite: Clothing/Head/Welding/flame_welding_mask.rsi
  - type: Clothing
    sprite: Clothing/Head/Welding/flame_welding_mask.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
      flatReductions:
        Blunt: 2
        Slash: 2
        Piercing: 2
  - type: ExplosionResistance
    damageCoefficient: 0.9

