- type: entity
  parent: ClothingBalaclavaBase
  id: ClothingBalaclavaMilitary
  name: military balaclava
  description: A synthetic material balaclava, breathable and comfortable for hiding your face from vengeful militia close to your family.
  components:
  - type: Sprite
    sprite: _Battlefield14/Clothing/Mask/balaclava.rsi
  - type: Clothing
    sprite: _Battlefield14/Clothing/Mask/balaclava.rsi
    clothingVisuals:
      balaclava:
      - state: equipped-BALACLAVA
  - type: Item
    size: Normal
    shape:
    - 0,0,0,1
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Snout # Doesnt matter because lizards are disabled but whatever
    - Hair

- type: entity
  parent: ClothingBalaclavaMilitary
  id: ClothingBalaclavaMilitarySkull
  name: skull balaclava
  description: A cheap balaclava with a skull texture printed on it, you're either larping in your bedroom or a war criminal if you own one of these. It's probably the former. Definetly the former.
  components:
  - type: Sprite
    sprite: _Battlefield14/Clothing/Mask/skullbalaclava.rsi
  - type: Clothing
    sprite: _Battlefield14/Clothing/Mask/skullbalaclava.rsi
    clothingVisuals:
      balaclava:
      - state: equipped-BALACLAVA

- type: entity
  parent: ClothingBalaclavaBase
  id: ClothingBalaclavaMilitaryOpen
  name: open balaclava
  description: Not good for hiding your face but does keep your head warm.
  components:
  - type: Sprite
    sprite: _Battlefield14/Clothing/Mask/balaclavaopen.rsi
  - type: Clothing
    sprite: _Battlefield14/Clothing/Mask/balaclavaopen.rsi
    clothingVisuals:
      balaclava:
      - state: equipped-BALACLAVA
  - type: Item
    size: Normal
    shape:
    - 0,0,0,1
  - type: HideLayerClothing
    slots:
    - Hair
