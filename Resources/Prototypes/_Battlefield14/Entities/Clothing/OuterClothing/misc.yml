- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterBombVest
  name: bomb vest
  description: Don't panic.
  components:
  - type: Sprite
    sprite: _Civ14/Objects/grenade.rsi
    state: suicide_vest
  - type: Clothing
    sprite: _Civ14/Objects/grenade.rsi
    clothingVisuals:
      outerClothing:
      - state: suicide_vest
  - type: TriggerOnSignal
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 200
    intensitySlope: 4
    maxIntensity: 13
    maxTileBreak: 1
  - type: AutoLinkReceiver
    channel: BombVest
  - type: WirelessNetworkConnection
    range: 3
  - type: ItemSlots
    slots:
      item:
        name: Detonator
        whitelist:
          components:
          - AutoLinkTransmitter
  - type: ContainerFill
    containers:
      item:
      - RemoteSignallerBombVest

