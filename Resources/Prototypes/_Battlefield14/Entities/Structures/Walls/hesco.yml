#region blue

- type: entity
  parent: BaseItem
  id: BF14HescoBarrierBlue
  name: HESCO barrier
  description: A HESCO barrier, its like a sandbag but bigger and better.
  suffix: item
  components:
  - type: Sprite
    sprite: _Battlefield14/Structures/Walls/hesco.rsi
    layers:
    - state: stack1_blue
      map: ["base"]
  - type: Item
    size: Large
  - type: SpawnAfterInteract
    prototype: BF14HescoBarrierBluePlaced
    doAfter: 2
    removeOnInteract: true
  - type: ExtendDescription
    descriptionList:
      - description: Left click on a tile to place it.
        color: green
        requireDetailRange: true
  - type: Appearance
  - type: Stack
    stackType: BF14HescoBarrierBlueStack
    count: 1
    baseLayer: base
    layerStates:
    - stack1_blue
    - stack2_blue
    - stack3_blue

- type: entity
  parent: BF14HescoBarrierBlue
  id: BF14HescoBarrierBlue10
  suffix: "10"
  components:
  - type: Stack
    stackType: SandbagFull
    count: 10

- type: stack
  id: BF14HescoBarrierBlueStack
  name: HESCO barrier
  spawn: BF14HescoBarrierBlue
  maxCount: 10

- type: entity
  parent: BaseWallTierOne
  id: BF14HescoBarrierBluePlaced
  name: HESCO barrier
  description: A HESCO barrier, its like a sandbag but bigger and better.
  components:
  - type: Tag
    tags:
    - Wall
  - type: Sprite
    sprite: _Battlefield14/Structures/Walls/hesco.rsi
    state: placed_blue
  - type: Icon
    sprite: _Battlefield14/Structures/Walls/hesco.rsi
    state: placed_blue
  - type: ExtendDescription
    descriptionList:
      - description: It is currently weak and fragile, it needs to be filled with soil. It can also be disasembled by Alt-clicking.
        color: green
        requireDetailRange: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DisassembleOnAltVerb
    prototype: BF14HescoBarrierBlue
    doAfter: 0.5
  - type: Construction
    graph: BF14HescoBarrierBlueGraph
    node: start

- type: constructionGraph
  id: BF14HescoBarrierBlueGraph
  start: start
  graph:
    - node: start
      entity: BF14HescoBarrierBluePlaced
      edges:
        - to: end
          completed:
            - !type:SpawnPrototype
              prototype: BF14HescoBarrierBlueBuilt
            - !type:DeleteEntity
          steps:
            - tag: SandbagFillable
              doAfter: 1
    - node: end
      edges: []

- type: entity
  parent: BaseWallTierOne
  id: BF14HescoBarrierBlueBuilt
  name: HESCO barrier
  description: A HESCO barrier, its like a sandbag but bigger and better.
  components:
  - type: Tag
    tags:
    - Wall
  - type: Sprite
    sprite: _Battlefield14/Structures/Walls/hesco.rsi
    layers:
    - state: placed_blue
    - state: fill1
      map: [ "fill" ]
  - type: Icon
    sprite: _Battlefield14/Structures/Walls/hesco.rsi
    state: icon_blue
  - type: Damageable
    damageModifierSet: BarricadeSandbag
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 700
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: RandomSprite
    available:
    - fill:
        fill1: ""
        fill2: ""
        fill3: ""
        fill4: ""
        fill5: ""

