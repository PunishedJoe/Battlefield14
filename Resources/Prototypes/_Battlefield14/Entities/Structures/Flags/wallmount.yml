- type: entity
  parent: BaseFlag
  id: BF_BaseFlag
  abstract: true
  components:
  - type: DisassembleOnAltVerb
    prototype: USMCFlagFolded
    doAfter: 3
  - type: ExtendDescription
    descriptionList:
      - description: Alt click to fold and place in your hand.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  id: BF_BaseFlagFolded
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: Clothing/Multiple/towel.rsi
    layers:
    - state: icon
      color: "#a64453"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#a64453"
      right:
      - state: inhand-right
        color: "#a64453"
    size: Small
  - type: SpawnAfterInteract
    prototype: USMCFlag
    doAfter: 3
    removeOnInteract: true
  - type: ExtendDescription
    descriptionList:
      - description: Click a tile/wall to unfold and place in the world.
        color: "#4f94ad"
        requireDetailRange: true

