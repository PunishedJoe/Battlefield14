- type: entity
  name: XT-520 Explosive Charge
  description: Used to fill inaccesible rooms with explosives.
  parent: BasePlasticExplosive
  id: XT520
  components:
  - type: Sprite
    sprite: Objects/Weapons/Bombs/c4.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
    - state: icon
      map: ["complete"]
  - type: OnUseTimerTrigger
    delay: 10
    delayOptions: [1, 5 ,10, 30, 60, 120, 300]
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
    startOnStick: false
    canToggleStartOnStick: true
  - type: TimerStartOnSignal
  - type: DeviceLinkSink
    ports:
      - Timer
  - type: ThroughWallProjectileFire
    projectilePrototype: explosiveBouncer
    projectileCount: 5
    throwVariation: 15
    throwDelay: 1
    sound:
      path: "/Audio/Weapons/smash.ogg"

- type: entity
  parent: BaseBullet
  id: explosiveBouncer
  name: mini grenade
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
      - state: grenade
  - type: Projectile
    onlyCollideWhenShot: true
    damage:
      types:
        Blunt: 7 # more damage than a punch.
  - type: ActiveTimerTrigger
    timeRemaining: 3
  - type: Fixtures
    fixtures:
      trigger:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        restitution: 0.9  # bouncyness
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    fillPrototype: BulletGrenadeF1Fragment
    capacity: 10
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 30
    intensitySlope: 3
    maxIntensity: 15
    maxTileBreak: 0

#    explosionType: Default
#    maxIntensity: 1 # max 15 per tile
#    intensitySlope: 1
#    totalIntensity: 2 # 30 total damage to distribute over tiles
#    maxTileBreak: 0

- type: entity
  name: APM-6 "Matryoshka" cluster charge
  description: Used to fill inaccesible rooms with explosives.
  parent: BasePlasticExplosive
  id: FuzeCharge
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Charges/fuze.rsi
    state: icon
    layers:
    - state: icon
      map: ["icon"]
  - type: OnUseTimerTrigger
    delay: 1
    delayOptions: [1, 5 ,10, 30, 60, 120, 300]
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
    startOnStick: false
    canToggleStartOnStick: false
  - type: TimerStartOnSignal
  - type: DeviceLinkSink
    ports:
      - Timer
  - type: ThroughWallProjectileFire
    projectilePrototype: explosiveBouncer
    projectileCount: 5
    throwVariation: 15
    throwDelay: 1
    sound:
      path: "/Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg"
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        base:
          Primed: { state: primed }
          Unprimed: { state: base }
  - type: ExtendDescription
    descriptionList:
      - description: Remote signal required for use.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  name: thermite charge
  description: When you mix fuel, metal oxide, and metal powder in just the right way, you sure as hell aren't making pancakes.
  parent: SeismicCharge
  id: ThermiteCharge
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Charges/thermite.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: OnUseTimerTrigger
    delay: 10
    delayOptions: [ 10, 15, 20]
    initialBeepDelay: 0
    beepSound:
      path: /Audio/Effects/refill.ogg
    startOnStick: true
    canToggleStartOnStick: true
#  - type: TriggerOnSignal
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 200
    intensitySlope: 10
    maxIntensity: 150
    maxTileBreak: 2

- type: entity
  parent: BaseItem
  id: BF14FloorChargeItem
  name: floor charge
  description: A big explosive used to breach holes in roofs to access the juicy contents below.
  suffix: Disarmed, Placeable
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _Civ14/Objects/grenade.rsi
    state: plastic-explosive0
  - type: Item
    size: Small
    storedSprite:
      sprite: _Civ14/Objects/grenade.rsi
      state: plastic-explosive1
  - type: SpawnAfterInteract
    prototype: BF14FloorCharge
    doAfter: 2
    removeOnInteract: true
  - type: ExtendDescription
    descriptionList:
      - description: It is disarmed, left click on a tile to place and arm it.
        color: green
        requireDetailRange: true

- type: entity
  name: floor charge
  description: A big explosive used to breach holes in roofs to access the juicy contents below.
  parent: BaseLandMine
  id: BF14FloorCharge
  suffix: Armed, Placed
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _Civ14/Objects/grenade.rsi
    state: plastic-explosive2
  - type: Physics
    bodyType: Dynamic
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Thermobaric
    totalIntensity: 300
    intensitySlope: 25
    maxIntensity: 60
  - type: ActiveTimerTrigger
    timeRemaining: 5
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/Effects/minibombcountdown.ogg
  - type: ExtendDescription
    descriptionList:
      - description: It is ARMED, get the hell back!
        color: red
        requireDetailRange: true
