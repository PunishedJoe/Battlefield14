- type: entity
  name: "1887 shorty"
  parent: WeaponShotgunUSM590Buckshot
  id: WeaponShotgunUS1887Short
  description: An outdated lever-action shotgun. A cut down barrel and stock, and enlarged lever allows one handed racking
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
    sprite: _Battlefield14/Objects/Weapons/Guns/Shotguns/1887short.rsi
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Shotguns/1887short.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/Shotguns/1887short.rsi
  - type: Gun
    fireRate: 1
    projectileSpeed: 30 # short barrel
    soundGunshot:
      path: /Audio/_Battlefield14/Weapons/Guns/misc/lever_fire.ogg
  - type: GunSpreadModifier
    spread: 2 # short barrel
  - type: BallisticAmmoProvider
    capacity: 5
  - type: AltFireMelee
    attackType: Heavy
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 6.7 # idiot
    angle: 0
    wideAnimationRotation: 90 # -90 if it takes bayonets (hits with muzzle) 90 if not (hits with butt)
    soundHit:
      collection: MetalThud
  - type: Appearance
  - type: ExtendDescription
    descriptionList:
      - description: This weapon can be stored on your auxillary suit storage slot.
        color: "#4f94ad"
        requireDetailRange: true
