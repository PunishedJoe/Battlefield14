#region US
# SMAW

- type: entity
  id: CartridgeSMAWHEAA
  name: "SMAW cartridge (HEAA)"
  parent: BaseCartridgeLauncher
  description: High explosive anti armour, pierces and does damage on the inside, like HEAT.
  components:
  - type: Item
    size: Large
  - type: Tag
    tags:
    - CartridgeLauncher
    - CartridgeSMAW
  - type: CartridgeAmmo
    proto: BulletRocket84mmHEATArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Launcher/SMAW.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: CartridgeSMAWNE
  name: "SMAW cartridge (SMAW-NE)"
  parent: BaseCartridgeLauncher
  description: Detonates on contact and sends fragments everywhere with a wide explosion for killing infantry.
  components:
  - type: Item
    size: Large
  - type: Tag
    tags:
    - CartridgeLauncher
    - CartridgeSMAW
  - type: CartridgeAmmo
    proto: BulletRocket83mmNEArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Launcher/SMAW.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: CartridgeSMAWHEDM
  name: "SMAW cartridge (HEDM)"
  parent: BaseCartridgeLauncher
  description: High explosive dual mode, explodes on contact in a small area to blast open walls and such.
  components:
  - type: Item
    size: Large
  - type: Tag
    tags:
    - CartridgeLauncher
    - CartridgeSMAW
  - type: CartridgeAmmo
    proto: BulletRocket83mmHEDMArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Launcher/SMAW.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

# Carl Gustav

- type: entity
  id: CartridgeCarlGustavHEDP502
  name: 84mm HEDP 502 shell
  parent: BaseCartridgeLauncher
  description: High explosive dual purpose, pierces and does damage on the inside, like HEAT.
  components:
  - type: Item
    size: Large
    storedRotation: -90
  - type: Tag
    tags:
    - CartridgeLauncher
    - CartridgeCarlGustav
  - type: CartridgeAmmo
    proto: BulletRocket84mmHEATArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/84x245mmR.rsi
    layers:
    - state: HEDP502
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: CartridgeCarlGustavHE441D
  name: 84mm HE441D shell
  parent: CartridgeCarlGustavHEDP502
  description: It goes boom.
  components:
  - type: CartridgeAmmo
    proto: BulletCarlGustavHE441DArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/84x245mmR.rsi
    layers:
    - state: HE441D
      map: ["enum.AmmoVisualLayers.Base"]

- type: entity
  id: CartridgeCarlGustavADM401
  name: 84mm ADM401 shell
  parent: CartridgeCarlGustavHEDP502
  description: Turns your recoilless rifle into a shotgun. Fires 25 flechettes
  components:
  - type: CartridgeAmmo
    proto: PelletCarlGustavASM401_Spread
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/84x245mmR.rsi
    layers:
    - state: ADM401
      map: ["enum.AmmoVisualLayers.Base"]

- type: entity
  id: PelletCarlGustavASM401_Spread
  categories: [ HideSpawnMenu ]
  parent: PelletCarlGustavASM401
  components:
  - type: ProjectileSpread
    proto: PelletCarlGustavASM401
    count: 25
    spread: 10

