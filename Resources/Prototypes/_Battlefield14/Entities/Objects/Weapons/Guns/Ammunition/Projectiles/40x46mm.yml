# Distinct from the ones in _Battlefield14\Entities\BattlefieldArtillery\Artillery\Factions\Nato\US\Kinetic\Ammunition but similar, chemicalsmoke and plasmagas dont work well with infantry gameplay

#region 40x46mm HE
- type: entity
  id: Bullet40x46mmHE
  name: 40x46mm HE grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 50
        Blunt: 40
    deleteOnCollide: true
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: HandGrenade
    totalIntensity: 20
    intensitySlope: 3
    maxIntensity: 2
    maxTileBreak: 0
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/ballistic.rsi
    layers:
    - state: grenade
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 3
    color: orange
    energy: 0.5

#region 40x46mm HEDP
- type: entity
  id: Bullet40x46mmHEDP
  name: 40x46mm HEDP grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 150
        Piercing: 40
    deleteOnCollide: true
  - type: HeFragProjectile
    fillPrototype: Bullet40x46mmHEDPFragment
    capacity: 20
    randomAngle: true
    minVelocity: 8
    maxVelocity: 15
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 30
    intensitySlope: 5
    maxIntensity: 5
    maxTileBreak: 1
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/ballistic.rsi
    layers:
    - state: grenade
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 3
    color: orange
    energy: 0.5

#region 40x46mm Fragmentation
- type: entity
  id: Bullet40x46mmFrag
  name: 40x46mm fragmentation grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 40
        Blunt: 40
    deleteOnCollide: true
  - type: HeFragProjectile
    fillPrototype: Bullet40x46mmFragFragment
    capacity: 60
    randomAngle: true
