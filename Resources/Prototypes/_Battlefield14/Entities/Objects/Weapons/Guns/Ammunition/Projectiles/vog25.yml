#region flare

- type: entity
  categories: [ HideSpawnMenu ]
  parent: Pellet12_gaugeFlare
  id: BulletVOG25Illumination
  name: VSG-25
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: flare-spent
  - type: Projectile
    damage:
      types:
        Structural: 15
        Blunt: 40

- type: entity
  categories: [ HideSpawnMenu ]
#  parent: BaseBullet
  id: ArtilleryMarkerVOG25Illumination
  name: VSG-25
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: flare-spent
  - type: IgnitionSource
    ignited: true
    temperature: 1000
  - type: TimedDespawn
    lifetime: 240
  - type: AmbientSound
    enabled: true
    volume: 0
    range: 7
    sound:
      path: /Audio/Items/Flare/flare_burn.ogg
      params:
        loop: true
  - type: IgniteOnCollide
    fireStacks: 1
  - type: PointLight
    enabled: true
    color: "#FF8080"
    radius: 15.0
    energy: 9.0

