#region chemical smoke

- type: entity
  id: BulletVOG25ChemicalSmoke
  name: "GRD-40 'Gvozd'"
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 15
        Blunt: 40
    deleteOnCollide: true
  - type: SmokeOnTrigger
    duration: 30
    spreadAmount: 20
    smokePrototype: Smoke
    solution:
      reagents:
      - ReagentId: CSGas
        Quantity: 50
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: gvozd-spent
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 3
    color: gray
    energy: 0.5

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BulletVOG25ChemicalSmokeArmingDistance
  name: "GRD-40 'Gvozd'"
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: gvozd-spent
  - type: Projectile
    damage:
      types:
        Structural: 15
        Blunt: 40
    deleteOnCollide: false
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    deleteOnRemove: true
  - type: SubmunitionProjectile
    submunitionPrototype: BulletVOG25ChemicalSmoke
    distanceDelay: 5
    submunitionDelay: 0
    submunitionCount: 1
    spreadAngle: 0
    velocityMultiplier: 1
  - type: StaminaDamageOnCollide
    damage: 20

- type: entity
  id: ArtilleryMarkerVOG25ChemicalSmoke
  name: artillery strike GRD-40 40mm CS-Gas
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn
  - type: TimedDespawn
    lifetime: 30
  - type: SmokeOnTrigger
    keysIn:
    - trigger
    duration: 30
    spreadAmount: 20
    solution:
      reagents:
      - ReagentId: CSGas
        Quantity: 50
  - type: EmitSoundOnTrigger
    keysIn:
    - trigger
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true

