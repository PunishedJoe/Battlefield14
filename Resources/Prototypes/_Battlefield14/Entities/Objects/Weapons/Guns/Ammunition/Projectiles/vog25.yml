#region HE-Frag

- type: entity
  id: BulletVOG25HEFrag
  name: VOG-25
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 15
        Piercing: 40
    deleteOnCollide: true
  - type: HeFragProjectile
    fillPrototype: Bullet43x30mmFragFragment
    capacity: 15
    randomAngle: true
    minVelocity: 8
    maxVelocity: 15
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: HandGrenade
    totalIntensity: 20
    intensitySlope: 3
    maxIntensity: 2
    maxTileBreak: 0
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: base-spent
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 3
    color: orange
    energy: 0.5

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BulletVOG25HEFragArmingDistance
  name: VOG-25
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: base-spent
  - type: Projectile
    damage:
      types:
        Structural: 15
        Blunt: 40
    deleteOnCollide: false
  - type: SubmunitionProjectile
    submunitionPrototype: BulletVOG25HEFrag
    distanceDelay: 5
    submunitionDelay: 0
    submunitionCount: 1
    spreadAngle: 0
    velocityMultiplier: 1
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    deleteOnRemove: true
  - type: StaminaDamageOnCollide
    damage: 20

- type: entity
  id: ArtilleryMarkerVOG25HEFrag
  name: artillery strike VOG-25 40mm HE-Frag
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: base-spent
  - type: TriggerOnSpawn
  - type: DeleteOnTrigger
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: HandGrenade
    totalIntensity: 20
    intensitySlope: 3
    maxIntensity: 2
    maxTileBreak: 0
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: Bullet43x30mmFragFragment
    capacity: 15
    randomAngle: true
    minVelocity: 8
    maxVelocity: 15

