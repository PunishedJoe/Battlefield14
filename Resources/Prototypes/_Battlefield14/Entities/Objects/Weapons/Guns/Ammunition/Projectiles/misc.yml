- type: entity
  name: decomissioner projectile
  id: BulletDecomissioner
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/robloxlaser.rsi
    layers:
    - state: robloxlaser
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque # Mono
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectHeavyLaser
  - type: StaminaDamageOnCollide
    damage: 100
  - type: Projectile
    impactEffect: BulletImpactEffectRedDisabler
    damage:
      types:
        Radiation: 500000
    armorPenetration: 1
    soundHit:
      path: /Audio/_Battlefield14/Weapons/Misc/LaserGun_Hit.ogg
    forceSound: true

- type: entity
  id: BulletRifleBFPulse
  name: pulse
  parent: BaseBulletIntermediate
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/ballistic.rsi
    layers:
    - state: pulse
  - type: Projectile
    damage:
      types:
        Piercing: 30
        Structural: 3
  - type: StaminaDamageOnCollide
    damage: 8 # ~13 hits to stun
