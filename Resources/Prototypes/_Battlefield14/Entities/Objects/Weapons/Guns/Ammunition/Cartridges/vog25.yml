#region paraflare

- type: entity
  id: CartridgeGrenadeVOG25IlluminationPara
  name: VG-40OP
  parent: CartridgeGrenadeVOG25HEFrag
  description: A parachute flare grenade, for best results shoot into the sky.
  suffix: paraflare
  components:
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: BulletVOG25IlluminationPara
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: paraflare
      map: ["enum.AmmoVisualLayers.Base"]
  - type: MortarShell
    delayPerTile: 0.3
    fireSound: /Audio/_Battlefield14/Weapons/Guns/GP25/gp25-blast-01.ogg
