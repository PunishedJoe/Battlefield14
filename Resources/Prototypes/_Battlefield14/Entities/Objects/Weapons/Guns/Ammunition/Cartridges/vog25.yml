  - type: ExtendDescription
    descriptionList:
      - description: Deploys parachute at approx 16 tiles.
        color: "#4f94ad"
        requireDetailRange: true
      - description: It is a VOG-25 pattern grenade.
        color: green
        requireDetailRange: true
