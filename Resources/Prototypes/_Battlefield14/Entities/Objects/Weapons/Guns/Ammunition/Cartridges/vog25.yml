#region HE frag

- type: entity
  id: CartridgeGrenadeVOG25HEFrag
  name: VOG-25
  parent: BaseCartridge40x46
  description: A soviet era caseless grenade. GRAU index 7P17.
  components:
  - type: Item
    size: Small
  - type: Tag
    tags:
    - Cartridge
    - Grenade
    - CartridgeGrenadeVOG25
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: BulletVOG25HEFragArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 20
    intensitySlope: 3
    totalIntensity: 2
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: MortarShell
    delayPerTile: 0.3
    fireSound: /Audio/_Battlefield14/Weapons/Guns/GP25/gp25-blast-01.ogg
    preExplosionSound: /Audio/_VXS14/Weapons/Guns/Artillery/mortarflyby.ogg
    explosionEntity: ArtilleryMarkerVOG25HEFrag
    insertSound: /Audio/_Battlefield14/Weapons/Guns/GP25/gp25_insert.ogg
    useDirectExplosion: false
  - type: ExtendDescription
    descriptionList:
      - description: Has 15 fragments.
        color: "#4f94ad"
        requireDetailRange: true
      - description: Has a minimum arming distance of 5 tiles.
        color: red
        requireDetailRange: true

#region CS gas

- type: entity
  id: CartridgeGrenadeVOG25ChemicalSmoke
  name: "GRD-40 'Gvozd'"
  parent: CartridgeGrenadeVOG25HEFrag
  description: A soviet era caseless grenade, packed with CS gas.
  suffix: CS gas
  components:
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: BulletVOG25ChemicalSmokeArmingDistance
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: gvozd
      map: ["enum.AmmoVisualLayers.Base"]
  - type: MortarShell
    delayPerTile: 0.3
    fireSound: /Audio/_Battlefield14/Weapons/Guns/GP25/gp25-blast-01.ogg
    preExplosionSound: /Audio/_VXS14/Weapons/Guns/Artillery/mortarflyby.ogg
    explosionEntity: ArtilleryMarkerVOG25ChemicalSmoke
    insertSound: /Audio/_Battlefield14/Weapons/Guns/GP25/gp25_insert.ogg
    useDirectExplosion: false
  - type: ExtendDescription
    descriptionList:
      - description: It is a VOG-25 pattern grenade.
        color: green
        requireDetailRange: true
      - description: Releases CS gas for 30 seconds.
        color: "#4f94ad"
        requireDetailRange: true
      - description: Has a minimum arming distance of 5 tiles.
        color: red
        requireDetailRange: true

