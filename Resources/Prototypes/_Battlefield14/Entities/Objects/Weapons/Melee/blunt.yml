- type: entity
  name: FUBAR
  parent: BaseItem
  id: FUBAR
  description: The BAR that fucks you up beyond all recognition. Can be used to pry open airlocks and unanchor things.
  components:
  - type: Sprite
    sprite: _NF/Objects/Tools/maintenance-jack.rsi
    state: icon
  - type: MeleeWeapon
    heavyStaminaCost: 20
    wideAnimationRotation: -90
    swingLeft: true
    attackRate: 0.6
    damage:
      types:
        Blunt: 10
        Structural: 5
    soundHit:
      collection: MetalThud
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: 2
  - type: Wieldable 
#    unwieldOnUse: false
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 35
        Structural: 95
  - type: PhysicalComposition
    materialComposition: 
      Steel: 200
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _NF/Objects/Tools/maintenance-jack.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
    - SUITSTORAGE2
    clothingVisuals:
      suitstorage2:
      - state: equipped-BACKPACK
  - type: ToolTileCompatible
  - type: Tool
    qualities:
      - Prying
      - Anchoring
    speedModifier: 1.2
    useSound: /Audio/Items/crowbar.ogg
  - type: Prying
    useSound: /Audio/Items/crowbar.ogg
    pryPowered: true
  - type: UseDelay
    delay: 1
#  - type: ClothingSpeedModifier
#    walkModifier: 0.9
#    sprintModifier: 0.9
  - type: ExtendDescription
    descriptionList:
      - description: This weapon can be stored on your auxillary suit storage slot.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  name: war hammer
  parent: BaseItem
  id: BF14WarHammer
  description: The perfect tool for wanton carnage.
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Melee/warhammer.rsi
    state: icon
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Melee/halberd.rsi
    quickEquip: false
    slots:
    - belt
    clothingVisuals:
      belt:
      - state: equipped-BELT
  - type: MeleeWeapon
    heavyStaminaCost: 5
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 25
        Structural: 5
    soundHit:
      collection: MetalThud
    bluntStaminaDamageFactor: 0.35
  - type: StaminaDamageOnHit
    damage: 10
  - type: Item
    size: Large
