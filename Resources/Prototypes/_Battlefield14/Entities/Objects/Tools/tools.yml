- type: entity
  name: entrenching tool
  parent: Shovel
  id: EntrenchingTool
  description: Standard issue military spade, for diggin', pryin', screwin', cuttin', and even chuckin'.
  components:
  - type: Sprite
    sprite: _NF/Objects/Tools/cm-shovel.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
        Slash: 5
        Structural: 5
  - type: Item
    sprite: _NF/Objects/Tools/cm-shovel.rsi
  - type: StaticPrice
    price: 2000
  - type: Sharp
  - type: ToolTileCompatible
  - type: Prying
    enabled: false
  - type: Tag
    tags:
    - BotanyShovel
    - Wirecutter
    - Screwdriver
    - Crowbar
    - Pickaxe
  - type: Tool
    qualities:
      - Digging
    speedModifier: 0.7
    useSound:
      path: /Audio/Items/shovel_dig.ogg
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior:
        - Digging
        - Prying
        - Hammering
        - Cutting
        - Slicing
        - Sawing
        sprite:
          sprite: _NF/Objects/Tools/cm-shovel.rsi
          state: icon
        useSound:
          path: /Audio/Items/shovel_dig.ogg
        changeSound:
          path: /Audio/Items/shovel_dig.ogg
      - behavior: Screwing
        sprite:
          sprite: _NF/Objects/Tools/cm-shovel.rsi
          state: icon
        useSound:
          path: /Audio/Items/screwdriver.ogg
        changeSound:
          path: /Audio/Items/shovel_dig.ogg
  - type: ThrowingAngle
    angle: 45
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 10
        Slash: 5
  - type: UseDelay
    delay: 1
  - type: BalloonPopper
  - type: Utensil
    types:
      - Knife
  - type: ExtendDescription
    descriptionList:
      - description: Use in hand to switch between screwdriver mode and other tool qualities.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  name: boltcutters
  parent: BaseItem
  id: Boltcutters
  description: This murders the wire.
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/wirecutter_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - PlantSampleTaker
    - Wirecutter
  - type: Sprite
    sprite: _Battlefield14/Objects/Tools/boltcutters.rsi
    layers:
    - state: base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: cover
      color: "#383838"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: cover-inhand-left
        color: "#383838"
      right:
      - state: inhand-right
      - state: cover-inhand-right
        color: "#383838"
    size: Large
    shape:
    - 0,0,0,3
  - type: Clothing
    quickEquip: false
    slots:
    - SUITSTORAGE2
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 5
    attackRate: 1
    soundHit:
      collection: MetalThud
  - type: Tool
    qualities:
    - Cutting
    speedModifier: 2
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15
        Structural: 10
  - type: StaticPrice
    price: 80
  - type: Retractor # Shitmed
    speed: 0.35
  - type: Hemostat # Shitmed
    speed: 0.6
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/Items/wirecutter.ogg
      params:
        variation: 0.125
    endSound:
      path: /Audio/Items/wirecutter.ogg
      params:
        variation: 0.125
#  - type: NailClipper # Mono
#    allowedClawTypes: ["SharpClaw"]
  - type: ExtendDescription
    descriptionList:
      - description: This item can be stored on your auxillary suit storage slot.
        color: "#4f94ad"
        requireDetailRange: true

- type: entity
  name: breaching saw
  parent: BaseItem
  id: BreachingSaw
  description: Powerful tool used to quickly drill through rocks.
  components:
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: _Battlefield14/Objects/Tools/breachingsaw.rsi
    layers:
    - state: base
    - state: cover
      color: "#383838"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: cover-inhand-left
        color: "#383838"
      right:
      - state: inhand-right
      - state: cover-inhand-right
        color: "#383838"
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - SUITSTORAGE2
    clothingVisuals:
      suitstorage2:
      - state: equipped-BACKPACK
      - state: cover-equipped-BACKPACK
        color: "#383838"
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 8
    heavyStaminaCost: 5
    damage:
      types:
        Blunt: 5
        Slash: 10
        Piercing: 2.5
        Structural: 25
  - type: MultiHandedItem
  - type: ExtendDescription
    descriptionList:
      - description: This item can be stored on your auxillary suit storage slot.
        color: "#4f94ad"
        requireDetailRange: true
