- type: entity
  parent: BasePetRock
  id: RockOrSomething
  name: rock or something
  description: i guess you could toss it at someone?
  components:
  - type: Sprite
    sprite: _NF/Objects/Fun/petrock.rsi
    layers:
    - state: rock

- type: entity
  parent: BaseItem
  id: JustFuckingDirt
  name: dirt
  description: i guess you could toss it at someone?
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    layers:
    - state: ash
      color: "#635231"
  - type: Tag
    tags:
    - SandbagFillable

- type: entity
  parent: [BaseItem, RecyclableItemClothSmall]
  name: lit rag
  id: RagItemLit
  description: It's on fire!.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/rag.rsi
    layers:
    - state: fire
      sprite: Effects/fire.rsi
    - state: rag
  - type: Appearance
  - type: Item
    size: Small
    sprite: Objects/Specific/Janitorial/rag.rsi
  - type: PointLight
    enabled: true
    netsync: false
    radius: 1.5
    color: orange
  - type: IgnitionSource
    ignited: true
  - type: ActiveTimerTrigger
    timeRemaining: 5
  - type: DeleteOnTrigger

- type: entity
  name: ship repair kit
  description: It's like a medkit, but for space ships.
  parent: BaseStorageItem
  id: ShipRepairKit
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Specific/Medical/firstaidkits.rsi
    state: surgerykit
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,3,2
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1 # BF14
    sprite: _Battlefield14/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: surgery
  - type: PhysicalComposition
    materialComposition:
      Plastic: 150
  - type: Tag
    tags:
    - Medkit
