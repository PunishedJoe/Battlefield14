# longer times due to large map size

- type: entity
  id: CapturePointInterchangeParking
  parent: BaseCapturePoint
  name: Parking lot control point
  suffix: Interchange, 180s / 3m
  components:
#  - type: POICapture
#    poiName: "Inside parking lot"
#    timeToCapture: 180
  - type: CapturePoint
    pointName: "Inside parking lot"
  - type: NavMapBeacon
    defaultText: "Inside parking lot"
    color: "#FFFF00"
  - type: WarpPoint
    location: "Inside parking"

