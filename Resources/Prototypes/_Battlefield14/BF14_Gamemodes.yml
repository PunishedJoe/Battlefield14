#region game rules

- type: entity
  id: Arcade
  parent: BaseGameRule
  components:
  - type: KillCalloutRule
  - type: PointManager
  - type: MaxTimeRestartRule
    roundMaxTime: 901 # 15 minutes
    roundEndDelay: 30

- type: entity
  id: TeamDeathMatch
  parent: BaseGameRule
  components:
  - type: KillCalloutRule
  - type: PointManager
  - type: RespawnDeadRule
    alwaysRespawnDead: true
  - type: RespawnTracker
    respawnDelay: 5
    deleteBody: true
  - type: MaxTimeRestartRule
    roundMaxTime: 601 # 10 minutes
    roundEndDelay: 30 # 30 seconds

- type: entity
  id: TeamDeathMatchHardcore
  parent: BaseGameRule
  components:
  - type: KillCalloutRule
  - type: PointManager
  - type: MaxTimeRestartRule
    roundMaxTime: 301 # 5 minutes
    roundEndDelay: 30 # 30 seconds

- type: entity
  id: TenMinuteRestart
  parent: BaseGameRule
  components:
  - type: MaxTimeRestartRule
    roundMaxTime: 601 # 10 minutes
    roundEndDelay: 120 # 2 minutes
