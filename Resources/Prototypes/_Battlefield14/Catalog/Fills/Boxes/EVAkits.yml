#region Base

- type: entity
  parent: BoxCardboard
  id: BaseEVAKit
  abstract: true
  components:
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,6,3
    whitelist:
      tags:
        - FitsInVoidsuitKit
        - Crowbar
        - Wrench
        - GPS
  - type: Sprite
    layers:
      - state: boxwide
      - state: extendedtank

#region Combat

- type: entity
  name: USMC combat EVA kit
  parent: BaseEVAKit
  id: EVAKitCombatUSMC
  description: A kit containing everything needed to survive and fight in space. Marine edition.
