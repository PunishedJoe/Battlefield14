- type: entity
  parent: ColMarTechBase
  id: CMVendPACTRGFWarVendor
  name: RGF war vendor
  description: Please sir, may I have a little more?
  suffix: ColMarTech
  components:
  - type: Sprite
    sprite: _Battlefield14/Structures/armoury.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
  - type: AccessReader
    access: [["PACTCommon"]]
  - type: CMAutomatedVendor
    access:
    - "PACTCommon"
    sections:
    - name: Armour
      choices: { BF14Armour: 1 }
      entries:
      - id: ClothingOuterArmorPlateCarrier6B45
        name: plate carrier
      - id: ArmorPlateMediumPackaged
        recommended: true
    - name: 'Personal Medicine'
