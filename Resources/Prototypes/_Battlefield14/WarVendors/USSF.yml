- type: entity
  parent: ColMarTechBase
  id: CMVendNATOUSSFWarVendor
  name: USSF boarder war vendor
  description: Aircraft-grade weaponry from a vending machine.
  suffix: ColMarTech
  components:
  - type: Sprite
    sprite: _Battlefield14/Structures/armoury.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
#      shader: unshaded
#    - state: panel
#      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["NATOCommon"]]
  - type: CMAutomatedVendor
    access:
    - "NATOCommon"
    sections:
    - name: Armour
      choices: { BF14Armour: 1 }
      entries:
      - id: EVAKitCombatUSMC
        name: voidsuit
        recommended: true
    - name: 'Personal Medicine'
      choices: { BF14PersonalMedicine: 1 }
      entries:
      - id: MedicationBoxPillsBicaridine
        name: bicaridine pills
        recommended: true
      - id: MedicationBoxSyrettesBicaridine
        name: bicaridine syrettes
      - id: MedicationBoxPillsKelotane
        name: kelotane pills
      - id: MedicationBoxSyrettesKelotane
        name: kelotane syrettes
      - id: MedicationBoxSyrettesTricordrazine
        name: tricordrazine syrettes
      - id: BlisterPackSyretteMeralyne
        name: meralyne syrettes
      - id: BlisterPackSyretteDermaline
        name: dermaline syrettes
      - id: FoodCondimentPacketKaolin
        name: kaolin powder packet
      - id: DefibrillatorDisposable
        name: disposable defibrillator
    - name: Backpack/belt
      choices: { BF14Storage: 2 }
      entries:
      - id: ClothingBackpackRucksackTan
        replaceSlot: back
        name: tan rucksack
        recommended: true
      - id: ClothingBackpackRucksackBlack
        replaceSlot: back
        name: black rucksack
      - id: ClothingBeltMilitaryWebbingUS
        replaceSlot: belt
        name: ALICE belt rig
      - id: ClothingBeltAssault
        replaceSlot: belt
        name: assault belt
      - id: ClothingBeltMedicalEMTFilledBF14Basic
        replaceSlot: belt
        name: basic medical belt
        amount: 4
    - name: Weapons
      entries:
      - id: WeaponRifleUSXM8
        amount: 10
      - id: WeaponRifleUSM27IAR
        amount: 3
      - id: WeaponRifleUSM4A1
        amount: 5
      - id: WeaponSubmachinegunDEMP510
        amount: 5
      - id: WeaponPistolUSMK27
        amount: 2
    - name: Utility
      entries:
      - id: ClothingHelmetAttachmentNVGsNATOPVS14Binocular
        amount: 5
      - id: RiotBulletShield
        amount: 3
      - id: CombatKnife
        amount: 10
      - id: JetpackBlackFilled
        amount: 10
      - id: HandHeldMassScanner
        amount: 50
      - id: Crowbar
        amount: 50
    - name: Sustainment
      entries:
      - id: Tourniquet
        amount: 20
      - id: BoxMRE
        amount: 50
      - id: FoodSnackNutribrick
        amount: 50
      - id: DrinkMREFlask
        amount: 50
      - id: OxygenTankFilled
        amount: 50
    - name: Misc
      entries:
      - id: USAFlagFolded
        amount: 3
      - id: WeaponShotgunUSM590
        amount: 1
      - id: ShellBoxBF12GaugeBreaching
        amount: 1

